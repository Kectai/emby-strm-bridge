name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.203
      - name: Install release prerequisites
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Verify and package
        run: ./scripts/package.sh
      - name: Verify tag matches package version
        run: |
          version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/Emby.StrmBridge/Emby.StrmBridge.csproj)
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: artifacts/Emby.StrmBridge-*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-package
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/Emby.StrmBridge-*.zip --verify-tag --generate-notes
