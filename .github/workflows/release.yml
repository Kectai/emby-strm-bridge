name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.203
      - name: Install release prerequisites
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Verify and package
        run: ./scripts/package.sh
      - name: Verify tag matches package version
        run: |
          version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/Emby.StrmBridge/Emby.StrmBridge.csproj)
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: |
            artifacts/Emby.StrmBridge-*.zip
            artifacts/Emby.StrmBridge-*.zip.sha256
            artifacts/RELEASE_NOTES.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: artifacts
      - name: Verify downloaded package checksum
        run: |
          cd artifacts
          shasum -a 256 -c Emby.StrmBridge-*.zip.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace immutable artifacts."
            exit 1
          fi
          prerelease_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/Emby.StrmBridge-*.zip \
            artifacts/Emby.StrmBridge-*.zip.sha256 "${prerelease_flags[@]}" \
            --verify-tag --notes-file artifacts/RELEASE_NOTES.md
